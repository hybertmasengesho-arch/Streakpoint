name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Phone upload support: if the repo only contains the .zip, unpack it first
      - name: Unpack the uploaded zip (if needed)
        run: |
          if [ ! -f package.json ]; then
            Z=$(ls -t *.zip 2>/dev/null | head -1)
            if [ -z "$Z" ]; then echo "No package.json and no .zip in the repo root - upload the Strikepoint zip"; exit 1; fi
            echo "Unpacking $Z"; unzip -o -q "$Z"
          fi
          ls

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy game into www/
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Landscape, fullscreen and LAN (cleartext) settings
        run: |
          M=android/app/src/main/AndroidManifest.xml
          S=android/app/src/main/res/values/styles.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$M"
          grep -q usesCleartextTraffic "$M" || sed -i '0,/<application/s//<application android:usesCleartextTraffic="true"/' "$M"
          sed -i 's#<item name="android:background">@null</item>#<item name="android:background">@null</item><item name="android:windowFullscreen">true</item>#' "$S"
          echo "--- manifest check ---"
          grep -c 'sensorLandscape' "$M"
          grep -c 'usesCleartextTraffic' "$M"
          grep -c 'windowFullscreen' "$S"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Strikepoint.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Strikepoint-APK
          path: Strikepoint.apk

      # Optional: also publish it under Releases so you can download it straight on your phone
      - name: Publish to Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Strikepoint (latest APK)
          files: Strikepoint.apk
          prerelease: true
